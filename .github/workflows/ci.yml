name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install API dependencies
        run: |
          cd api
          npm ci --ignore-scripts

      - name: Run API tests
        run: |
          cd api
          npm test

      - name: Linter
        run: |
          cd api
          npm run lint
          
      # --- Checks des routes API ---
      - name: Test API routes
        run: |
          cd api
          npm run start &
          timeout 30 bash -c 'until curl -s http://localhost:3000/health >/dev/null; do sleep 1; done'
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/products | grep -q "200" || { echo "❌ Route /api/products échouée"; exit 1; }
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/users | grep -q "200" || { echo "❌ Route /api/users échouée"; exit 1; }
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health | grep -q "200" || { echo "❌ Route /api/health échouée"; exit 1; }

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build -t trainshop-api:latest -f api/Dockerfile api/

      - name: Build frontend Docker image
        run: |
          docker build -t trainshop-frontend:latest -f frontend/Dockerfile frontend/