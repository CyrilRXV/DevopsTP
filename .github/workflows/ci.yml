name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install API dependencies
        run: |
          cd api
          npm ci --ignore-scripts

      - name: Run API tests
        run: |
          cd api
          npm test

      - name: Linter
        run: npm run lint

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build applicatif
        run: npm run build