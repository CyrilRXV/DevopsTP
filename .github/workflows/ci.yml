name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Linter
        working-directory: api
        run: npm run lint
          
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build -t trainshop-api:latest -f api/Dockerfile api/

      - name: Build frontend Docker image
        run: |
          docker build -t trainshop-frontend:latest -f frontend/Dockerfile frontend/

      - name: Start container
        run: |
          docker run --detach \
            --name trainshop-api-ci \
            --publish 3000:3000 \
            trainshop-api:ci

      - name: Wait & test /health
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:3000/health)
            echo "Attempt $i — HTTP $STATUS"
            [ "$STATUS" -eq 200 ] && echo "Health check passed!" && exit 0
            sleep 2
          done
          docker logs trainshop-api-ci
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker stop trainshop-api-ci || true
          docker rm   trainshop-api-ci || true
          docker rmi  trainshop-api:ci || true