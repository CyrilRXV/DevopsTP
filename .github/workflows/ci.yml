name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install API dependencies
        run: |
          cd api
          npm ci --ignore-scripts

      - name: Run API tests
        run: |
          cd api
          npm test

      - name: Build API Docker image
        run: |
          docker build -t trainshop-api:latest -f api/Dockerfile .

      - name: Build frontend Docker image
        run: |
          docker build -t trainshop-frontend:latest -f frontend/Dockerfile .